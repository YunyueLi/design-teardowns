name: Bug report
description: Report something wrong with a teardown page or the gallery.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please give us enough detail to reproduce it.
  - type: textarea
    id: what-happened
    attributes:
      label: What is wrong?
      description: A clear description of the problem and what you saw.
      placeholder: Describe the bug.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Which teardown or page?
      description: The teardown folder or page where the problem appears.
      placeholder: For example, teardowns/linear/teardown.html, or the gallery index.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the problem?
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
      placeholder: What should have happened?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and operating system, and whether you opened the page via file:// or over the web.
      placeholder: For example, Chrome 126 on macOS, opened via file://
    validations:
      required: false
