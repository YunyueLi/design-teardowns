name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege permissions required to publish to GitHub Pages.
permissions:
  contents: read
  pull-requests: read
  actions: read
  pages: write
  id-token: write

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  deploy:
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    timeout-minutes: 10
    # Only actual site releases join this group. The latest pending full site
    # contains earlier changes; documentation pushes never interrupt deployment.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Serve the site as-is. The .nojekyll file disables Jekyll processing so
      # that files and folders beginning with an underscore are published.
      - name: Disable Jekyll processing
        run: touch .nojekyll

      # Upload the whole repository as the site. The root index.html redirects
      # to teardowns/index.html.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
