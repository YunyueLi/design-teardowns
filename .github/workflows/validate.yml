name: Validate gallery

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:

permissions:
  contents: read

jobs:
  gallery:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # A newer revision replaces the same PR's checks, without cancelling sibling shards.
    concurrency:
      group: ${{ github.workflow }}-gallery-${{ github.event.pull_request.number || github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate catalogue and maintenance
        run: |
          node tools/build-gallery-featured.mjs --check
          node tools/check-gallery.mjs
          node tools/test-gallery-maintenance.mjs
          python3 tools/generate_index.py --check
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/beamline-devtest" playwright@1.62.1
          node "$RUNNER_TEMP/beamline-devtest/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check browser interactions
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/beamline-devtest/node_modules/playwright
          BEAMLINE_ARTIFACT_DIR: artifacts/ci
          BEAMLINE_SHARD: ${{ matrix.shard }}/3
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 > "$RUNNER_TEMP/beamline-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/teardowns/index.html > /dev/null; then break; fi
            sleep 1
          done
          node tools/check-beamline.mjs
      - name: Save browser acceptance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: beamline-acceptance-${{ matrix.shard }}
          path: artifacts/ci/
          if-no-files-found: ignore
          retention-days: 3
