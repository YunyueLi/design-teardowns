<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Design Teardowns</title>
<meta http-equiv="refresh" content="0; url=teardowns/index.html"/>
<link rel="canonical" href="teardowns/index.html"/>
<style>
  :root{--wall:#f6f4ef;--ink:#1c1c1c;--ink2:rgba(28,28,28,.6);--rubric:#9a3524}
  @media (prefers-color-scheme: dark){:root{--wall:#121212;--ink:#e8e6e0;--ink2:rgba(232,230,224,.6);--rubric:#c4573f}}
  html,body{margin:0;height:100%;background:var(--wall);color:var(--ink);
    font-family:"EB Garamond","Songti SC","Noto Serif SC",serif;display:grid;place-items:center;text-align:center}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;
    background:url('teardowns/_gallery/brand/moon.jpg') center/cover no-repeat;
    mix-blend-mode:multiply;opacity:.5}
  @media (prefers-color-scheme: dark){body::before{filter:invert(1);mix-blend-mode:screen;opacity:.42}}
  .in{position:relative;z-index:1}
  .k{font-size:11px;letter-spacing:.5em;text-indent:.5em;color:var(--rubric);margin-bottom:20px}
  a{color:var(--ink);font-size:19px;letter-spacing:.18em;text-decoration:none;
    border:1px solid rgba(28,28,28,.3);padding:14px 32px;display:inline-block;transition:all .4s ease}
  @media (prefers-color-scheme: dark){a{border-color:rgba(232,230,224,.3)}}
  a:hover{background:var(--ink);color:var(--wall);border-color:var(--ink)}
  p{color:var(--ink2);font-size:12.5px;margin-top:20px;letter-spacing:.05em}
</style>
</head>
<body>
  <div class="in">
    <div class="k">DESIGN TEARDOWNS</div>
    <a href="teardowns/index.html">Enter the gallery</a>
    <p>Redirecting. Use the link above if nothing happens.</p>
  </div>
</body>
</html>
